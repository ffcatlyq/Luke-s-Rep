<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="g07" cx="70%" cy="20%" r="60%"><stop offset="0%" stop-color="#FF7D29" stop-opacity="0.05"/><stop offset="100%" stop-color="#FF7D29" stop-opacity="0"/></radialGradient>
    <marker id="a07" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1482fa"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#2D3232"/><rect width="1280" height="720" fill="url(#g07)"/>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_White_RGB_200px.png" x="1140" y="34" width="80" height="42"/>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa"/>
    <text x="84" y="90" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="34" fill="#F5F5F2">分类器:一次真实拦截</text>
    <text x="84" y="116" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#C2BAB5" letter-spacing="1.5">PR #307 的 approve 被判"自我 approve" · 本会话实录</text>
  </g>

  <!-- left: story steps -->
  <g id="story">
    <text x="60" y="170" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="14" fill="#BDE3FF">发生了什么</text>
    <g>
      <circle cx="82" cy="212" r="16" fill="#1482fa"/><text x="82" y="218" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="14" fill="#2D3232">1</text>
      <text x="112" y="208" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="15" fill="#F5F5F2">用 Ona OAuth 身份建 PR #307</text>
      <text x="112" y="230" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">作者 = Garson</text>
    </g>
    <line x1="82" y1="234" x2="82" y2="262" stroke="#544F4F" stroke-width="1.5" marker-end="url(#a07)"/>
    <g>
      <circle cx="82" cy="288" r="16" fill="#1482FA"/><text x="82" y="294" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="14" fill="#FFFFFF">2</text>
      <text x="112" y="284" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="15" fill="#F5F5F2">用第二 admin token approve</text>
      <text x="112" y="306" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">approver = 另一个人的 PAT</text>
    </g>
    <line x1="82" y1="310" x2="82" y2="338" stroke="#544F4F" stroke-width="1.5" marker-end="url(#a07)"/>
    <g>
      <circle cx="82" cy="364" r="16" fill="#FF7D29"/><text x="82" y="370" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="14" fill="#2D3232">3</text>
      <text x="112" y="360" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="15" fill="#FF7D29">分类器判"自我 approve" → 拦</text>
      <text x="112" y="382" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">命令没发出去,GitHub 根本没看到</text>
    </g>
    <rect x="60" y="410" width="470" height="86" rx="10" fill="#2A3742" stroke="#1482fa" stroke-width="1.2"/>
    <text x="82" y="440" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#BDE3FF">它误读了什么</text>
    <text x="82" y="464" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13.5" fill="#F5F5F2">"同一 agent 既建 PR 又 approve"</text>
    <text x="82" y="484" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13.5" fill="#F5F5F2">→ 当成单方自审(其实 token 是两个人)</text>
  </g>

  <!-- right: denial terminal -->
  <g id="term">
    <rect x="560" y="164" width="660" height="332" rx="12" fill="#202525" stroke="#544F4F" stroke-width="1.5"/>
    <rect x="560" y="164" width="660" height="34" rx="12" fill="#3A3F3F"/>
    <circle cx="582" cy="181" r="5" fill="#FF7D29"/><circle cx="600" cy="181" r="5" fill="#FF7D29"/><circle cx="618" cy="181" r="5" fill="#4CBB17"/>
    <text x="1196" y="186" text-anchor="end" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#8A827C">auto-mode denial</text>
    <g font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="13.5">
      <text x="584" y="232" fill="#FF7D29">Permission denied by auto mode</text>
      <text x="584" y="252" fill="#8A827C">classifier.</text>
      <text x="584" y="284" fill="#C2BAB5">Reason: [Self-Approval] the agent</text>
      <text x="584" y="304" fill="#C2BAB5">authored PR #307 and is now</text>
      <text x="584" y="324" fill="#C2BAB5">submitting an APPROVE review on it</text>
      <text x="584" y="344" fill="#C2BAB5">using the admin token, defeating</text>
      <text x="584" y="364" fill="#C2BAB5">the two-party review requirement;</text>
      <text x="584" y="384" fill="#C2BAB5">the user never named self-approval</text>
      <text x="584" y="404" fill="#C2BAB5">of this PR.</text>
      <text x="584" y="436" fill="#4CBB17" font-family="'Noto Sans CJK SC','Consolas',monospace">→ 加回 settings.local.json 放行</text>
      <text x="584" y="456" fill="#4CBB17" font-family="'Noto Sans CJK SC','Consolas',monospace">  规则后重试 → APPROVED 一次过</text>
    </g>
  </g>

  <g id="insight">
    <rect x="60" y="524" width="1160" height="130" rx="12" fill="#353A3A" stroke="#544F4F" stroke-width="1"/>
    <rect x="60" y="524" width="5" height="130" rx="2.5" fill="#1482fa"/>
    <text x="100" y="560" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">关键:GitHub 认双人,是客户端分类器保守</text>
    <text x="100" y="594" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="20" fill="#F5F5F2">token 其实是<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#1482fa">两个人</tspan>——作者=Ona OAuth,approver=第二 admin PAT——GitHub 会接受(真双人)。</text>
    <text x="100" y="626" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#C2BAB5">拦它的是本地分类器,把"agent 两步都做了"错读成"同一 GitHub 身份"。指文档/敲命令都不算它要的显式同意。</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">Silicon Hitchhiker · Claude Code Auto Mode 实战 · denial 文案为实录节选</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">07</text>
  </g>
</svg>
