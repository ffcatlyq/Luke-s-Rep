<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1482fa"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4CBB17"/></marker>
    <marker id="aOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FF7D29"/></marker>
    <radialGradient id="g04" cx="50%" cy="20%" r="60%"><stop offset="0%" stop-color="#1482fa" stop-opacity="0.06"/><stop offset="100%" stop-color="#1482fa" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#2D3232"/>
  <rect width="1280" height="720" fill="url(#g04)"/>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_White_RGB_200px.png" x="1140" y="34" width="80" height="42"/>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa"/>
    <text x="84" y="90" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="34" fill="#F5F5F2">架构:两道闸,一本地一服务端</text>
    <text x="84" y="116" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#C2BAB5" letter-spacing="1.5">AUTO-MODE ≠ GITHUB 分支保护 · 本地这道拦了,服务端那道根本没轮到</text>
  </g>

  <!-- 停下问你 (拦 分支目标) -->
  <g id="ask">
    <rect x="360" y="158" width="220" height="52" rx="10" fill="#3A2A1C" stroke="#FF7D29" stroke-width="1.5"/>
    <text x="470" y="182" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="15" fill="#FF7D29">拦 → 停下问你</text>
    <text x="470" y="200" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="12" fill="#C2BAB5">危险/存疑动作弹权限确认</text>
  </g>

  <!-- 命令 -->
  <g id="cmd">
    <rect x="60" y="288" width="200" height="104" rx="12" fill="#3A3F3F" stroke="#544F4F" stroke-width="1.5"/>
    <text x="160" y="330" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="16" fill="#F5F5F2">你的命令</text>
    <text x="160" y="356" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#BDE3FF">gh pr merge</text>
    <text x="160" y="374" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#BDE3FF">approve curl</text>
  </g>

  <!-- Gate ① 本地 -->
  <g id="gate1">
    <rect x="312" y="250" width="298" height="180" rx="12" fill="#3A3F3F" stroke="#1482fa" stroke-width="2"/>
    <text x="332" y="284" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="18" fill="#BDE3FF">① 本地 auto-mode 分类器</text>
    <text x="332" y="308" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">build-cli / Ona 客户端,在你机器上</text>
    <line x1="332" y1="322" x2="590" y2="322" stroke="#544F4F" stroke-width="1"/>
    <text x="332" y="348" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">每次 agent 要跑 bash 前判断:</text>
    <text x="332" y="374" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">这条能自主跑,还是先问你?</text>
    <text x="332" y="404" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">规则来自 settings.local.json 放行表</text>
  </g>

  <!-- Gate ② 服务端 -->
  <g id="gate2">
    <rect x="690" y="250" width="298" height="180" rx="12" fill="#3A3F3F" stroke="#0B41CD" stroke-width="2"/>
    <text x="710" y="284" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="18" fill="#BDE3FF">② GitHub Org Ruleset</text>
    <text x="710" y="308" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">分支保护,GitHub 服务端强制</text>
    <line x1="710" y1="322" x2="968" y2="322" stroke="#544F4F" stroke-width="1"/>
    <text x="710" y="348" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">main 必须 PR + 1 approve</text>
    <text x="710" y="374" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">才能合入(repo admin 也不能绕)</text>
    <text x="710" y="404" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">这是"为什么需要第二 admin approve"</text>
  </g>

  <!-- merged -->
  <g id="merged">
    <rect x="1040" y="288" width="180" height="104" rx="12" fill="#26331F" stroke="#4CBB17" stroke-width="1.5"/>
    <g transform="translate(1108,318) scale(1.1)" fill="none" stroke="#4CBB17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l9 -9"/></g>
    <text x="1130" y="372" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="15" fill="#4CBB17">merged to main</text>
  </g>

  <!-- arrows -->
  <line x1="262" y1="340" x2="310" y2="340" stroke="#1482fa" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="470" y1="250" x2="470" y2="214" stroke="#FF7D29" stroke-width="2" marker-end="url(#aOrange)"/>
  <line x1="612" y1="330" x2="688" y2="330" stroke="#4CBB17" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="650" y="322" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="12" fill="#4CBB17">放行</text>
  <line x1="990" y1="340" x2="1038" y2="340" stroke="#0B41CD" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- local vs server braces -->
  <text x="461" y="456" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1">▲ 本地(你的机器 / 客户端)</text>
  <text x="839" y="456" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="12" fill="#BDE3FF" letter-spacing="1">▲ 服务端(GitHub)</text>

  <!-- takeaway -->
  <g id="takeaway">
    <rect x="60" y="504" width="1160" height="150" rx="12" fill="#353A3A" stroke="#544F4F" stroke-width="1"/>
    <rect x="60" y="504" width="5" height="150" rx="2.5" fill="#1482fa"/>
    <text x="100" y="540" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">一句话读懂这张图</text>
    <text x="100" y="574" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="23" fill="#F5F5F2">auto-mode 把命令拦在<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#1482fa">本地</tspan>,GitHub 分支保护在<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#BDE3FF">服务端</tspan>——</text>
    <text x="100" y="606" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="23" fill="#F5F5F2">本地这道拦了,<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#FF7D29">服务端那道根本没被触发</tspan>。</text>
    <text x="100" y="636" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#C2BAB5">所以"main 保护是 GitHub 加的,跟 auto-mode 什么关系?"——没关系,是本地又多一道你没算到的闸。</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">Silicon Hitchhiker · Claude Code Auto Mode 实战 · 改编自上游 general_dark_tech_claude_code_auto_mode</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">04</text>
  </g>
</svg>
