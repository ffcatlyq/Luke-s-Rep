<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><radialGradient id="g03" cx="50%" cy="18%" r="60%"><stop offset="0%" stop-color="#1482fa" stop-opacity="0.06"/><stop offset="100%" stop-color="#1482fa" stop-opacity="0"/></radialGradient></defs>
  <rect width="1280" height="720" fill="#2D3232"/><rect width="1280" height="720" fill="url(#g03)"/>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_White_RGB_200px.png" x="1140" y="34" width="80" height="42"/>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa"/>
    <text x="84" y="90" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="34" fill="#F5F5F2">什么是 Auto Mode</text>
    <text x="84" y="116" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#C2BAB5" letter-spacing="1.5">不是"全放开",是规则化的中间态</text>
  </g>

  <!-- three options -->
  <g id="opt1">
    <rect x="60" y="180" width="360" height="300" rx="12" fill="#3A3F3F" stroke="#544F4F" stroke-width="1.5"/>
    <text x="240" y="222" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="19" fill="#C2BAB5">全手动</text>
    <text x="240" y="250" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#8A827C">default</text>
    <line x1="90" y1="272" x2="390" y2="272" stroke="#544F4F" stroke-width="1"/>
    <text x="90" y="306" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">每条命令都停下问你</text>
    <text x="90" y="338" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#4CBB17">✓ 最安全</text>
    <text x="90" y="368" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#FF7D29">× 审批疲劳、慢</text>
    <text x="90" y="440" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">适合:高风险、探索性操作</text>
  </g>

  <g id="opt2">
    <rect x="460" y="164" width="360" height="332" rx="12" fill="#2A3742" stroke="#1482fa" stroke-width="2.5"/>
    <rect x="460" y="164" width="360" height="34" rx="12" fill="#1482fa"/>
    <text x="640" y="187" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="14" fill="#2D3232">推荐 · 中间态</text>
    <text x="640" y="240" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="21" fill="#BDE3FF">Auto Mode</text>
    <text x="640" y="266" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">规则放行 + 危险仍拦</text>
    <line x1="490" y1="286" x2="790" y2="286" stroke="#544F4F" stroke-width="1"/>
    <text x="490" y="318" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">本地一道分类器,每次 agent</text>
    <text x="490" y="340" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">要跑 bash 前判断能否自主跑</text>
    <text x="490" y="376" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#4CBB17">✓ 机械步骤一口气过</text>
    <text x="490" y="404" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#4CBB17">✓ 危险动作仍拦下问</text>
    <text x="490" y="462" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">规则来自 settings.local.json 放行表</text>
  </g>

  <g id="opt3">
    <rect x="860" y="180" width="360" height="300" rx="12" fill="#3A3F3F" stroke="#544F4F" stroke-width="1.5"/>
    <text x="1040" y="222" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="19" fill="#C2BAB5">全放开</text>
    <text x="1040" y="250" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#FF7D29">--dangerously-skip</text>
    <line x1="890" y1="272" x2="1190" y2="272" stroke="#544F4F" stroke-width="1"/>
    <text x="890" y="306" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#F5F5F2">什么都不问,全自动</text>
    <text x="890" y="338" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#4CBB17">✓ 最快</text>
    <text x="890" y="368" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#FF7D29">× 删库/外发/挪 token 也不拦</text>
    <text x="890" y="440" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">适合:一次性沙箱、可弃环境</text>
  </g>

  <g id="def">
    <rect x="60" y="512" width="1160" height="142" rx="12" fill="#353A3A" stroke="#544F4F" stroke-width="1"/>
    <rect x="60" y="512" width="5" height="142" rx="2.5" fill="#1482fa"/>
    <text x="100" y="550" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">一句话定义</text>
    <text x="100" y="584" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="21" fill="#F5F5F2">Auto Mode = 在<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#1482fa">全手动</tspan>和<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#FF7D29">全放开</tspan>之间,用<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#BDE3FF">规则</tspan>决定哪些自动放行、哪些仍拦下问。</text>
    <text x="100" y="616" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#C2BAB5">它跑在 build-cli / Ona 客户端(你的机器上),是一道本地闸——记住这点,下一页讲它和 GitHub 那道闸的关系。</text>
    <text x="100" y="640" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">放行的边界你自己定(settings.local.json);硬护栏(删库/外发等)永远拦,规则也绕不过。</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">Silicon Hitchhiker · Claude Code Auto Mode 实战</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">03</text>
  </g>
</svg>
