<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><radialGradient id="g06" cx="30%" cy="20%" r="60%"><stop offset="0%" stop-color="#1482fa" stop-opacity="0.06"/><stop offset="100%" stop-color="#1482fa" stop-opacity="0"/></radialGradient></defs>
  <rect width="1280" height="720" fill="#2D3232"/><rect width="1280" height="720" fill="url(#g06)"/>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_White_RGB_200px.png" x="1140" y="34" width="80" height="42"/>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa"/>
    <text x="84" y="90" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="34" fill="#F5F5F2">权限:怎么把自主权给回来</text>
    <text x="84" y="116" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#C2BAB5" letter-spacing="1.5">PERMISSIONS · settings.local.json 放行规则</text>
  </g>

  <!-- left: three tiers -->
  <g id="tiers">
    <text x="60" y="168" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="14" fill="#BDE3FF">三级权限模型</text>
    <g>
      <rect x="60" y="188" width="500" height="90" rx="12" fill="#3A3F3F" stroke="#544F4F" stroke-width="1.5"/>
      <text x="84" y="222" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="17" fill="#C2BAB5">默认:问</text>
      <text x="84" y="252" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13.5" fill="#F5F5F2">没规则的命令,auto-mode 停下弹权限确认</text>
    </g>
    <g>
      <rect x="60" y="290" width="500" height="90" rx="12" fill="#2A3742" stroke="#4CBB17" stroke-width="2"/>
      <text x="84" y="324" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="17" fill="#4CBB17">放行规则:自动过</text>
      <text x="84" y="354" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13.5" fill="#F5F5F2">settings.local.json 里 allow 的,不再问</text>
    </g>
    <g>
      <rect x="60" y="392" width="500" height="90" rx="12" fill="#3A3F3F" stroke="#FF7D29" stroke-width="1.5"/>
      <text x="84" y="426" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="17" fill="#FF7D29">硬护栏:永远拦</text>
      <text x="84" y="456" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13.5" fill="#F5F5F2">删库/外发等 hook,放行规则也绕不过</text>
    </g>
  </g>

  <!-- right: settings.local.json code card -->
  <g id="code">
    <rect x="600" y="188" width="620" height="294" rx="12" fill="#202525" stroke="#544F4F" stroke-width="1.5"/>
    <rect x="600" y="188" width="620" height="34" rx="12" fill="#3A3F3F"/>
    <circle cx="622" cy="205" r="5" fill="#FF7D29"/><circle cx="640" cy="205" r="5" fill="#FF7D29"/><circle cx="658" cy="205" r="5" fill="#4CBB17"/>
    <text x="1196" y="210" text-anchor="end" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#8A827C">.claude/settings.local.json</text>
    <g font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14.5">
      <text x="624" y="256" fill="#C2BAB5">{</text>
      <text x="644" y="280" fill="#C2BAB5">"permissions": {</text>
      <text x="664" y="304" fill="#BDE3FF">"allow"<tspan fill="#C2BAB5">: [</tspan></text>
      <text x="684" y="328" fill="#4CBB17">"Bash(gh pr merge:*)"<tspan fill="#C2BAB5">,</tspan></text>
      <text x="684" y="352" fill="#4CBB17">"Bash(curl … /reviews)"<tspan fill="#C2BAB5">,</tspan></text>
      <text x="684" y="376" fill="#4CBB17">"Bash(gitpod user secret:*)"</text>
      <text x="664" y="400" fill="#C2BAB5">]</text>
      <text x="644" y="424" fill="#C2BAB5">}</text>
      <text x="624" y="448" fill="#C2BAB5">}</text>
    </g>
  </g>
  <text x="600" y="474" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="12.5" fill="#8A827C">加这几条,approve / merge 就不再逐条弹窗</text>

  <g id="warn">
    <rect x="60" y="512" width="1160" height="142" rx="12" fill="#353A3A" stroke="#544F4F" stroke-width="1"/>
    <rect x="60" y="512" width="5" height="142" rx="2.5" fill="#FF7D29"/>
    <text x="100" y="550" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="13" fill="#FF7D29" letter-spacing="1.5">这文件的关键性质(下一段故事的伏笔)</text>
    <text x="100" y="584" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="20" fill="#F5F5F2"><tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#BDE3FF">settings.local.json</tspan> 是 <tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#FF7D29">gitignored + 每容器独立</tspan></text>
    <text x="100" y="616" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="14" fill="#C2BAB5">不进 git、不随 clone 走;换容器 = 一份新的空文件。给的自主权是"本机本容器"的,不会自己跟过去。</text>
    <text x="100" y="640" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">改 settings 不热加载,需开新会话生效。</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">Silicon Hitchhiker · Claude Code Auto Mode 实战</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="11" fill="#8A827C">06</text>
  </g>
</svg>
