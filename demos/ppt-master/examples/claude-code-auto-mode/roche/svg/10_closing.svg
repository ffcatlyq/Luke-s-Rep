    <text x="450" y="398" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="16" fill="#BDE3FF">① 本地 auto-mode</text>
    <text x="450" y="426" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">settings.local.json 放行</text>
    <rect x="680" y="360" width="300" height="96" rx="12" fill="#3A3F3F" stroke="#0B41CD" stroke-width="1.5"/>
    <text x="830" y="398" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" font-size="16" fill="#BDE3FF">② 服务端 GitHub</text>
    <text x="830" y="426" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#C2BAB5">PR + 1 approve 分支保护</text>
    <text x="640" y="414" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans Light',sans-serif" font-size="22" fill="#8A827C">+</text>
