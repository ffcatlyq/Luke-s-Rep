    <text x="336" y="522" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="16" fill="#F5F5F2">· 别把<tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#FF7D29">本地拦</tspan>当成 <tspan font-family="'Noto Sans CJK SC','Roche Sans Medium',sans-serif" fill="#BDE3FF">GitHub 拦</tspan>——排查方向不同</text>
    <text x="336" y="556" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="16" fill="#F5F5F2">· 搬家记得带 <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#BDE3FF">settings.local.json</tspan>(gitignored,裸切会丢)</text>
