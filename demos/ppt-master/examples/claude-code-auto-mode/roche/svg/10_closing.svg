  <text x="640" y="662" text-anchor="middle" font-family="'Noto Sans CJK SC','Roche Sans',sans-serif" font-size="13" fill="#8A827C">Silicon Hitchhiker · 罗氏 AI 社区 · 改编自上游 ppt-master「Claude Code Auto Mode」</text>
