<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.07" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">Same skeleton, three asymmetries</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">ENCODER STACK · DECODER STACK · N = 6 · d_model = 512</text>
  </g>

  <g id="card-encoder">
    <rect x="80" y="160" width="555" height="500" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <path d="M 94 160 h 527 a 14 14 0 0 1 14 14 v 90 h -555 v -90 a 14 14 0 0 1 14 -14 Z" fill="#0B41CD" />
    <text x="357" y="212" text-anchor="middle" font-family="'Roche Sans Light',sans-serif" font-size="28" fill="#FFFFFF">Encoder</text>
    <text x="357" y="240" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#95C7FD" letter-spacing="1">N = 6 IDENTICAL LAYERS</text>

    <g id="enc-sublayer-1">
      <rect x="110" y="300" width="495" height="56" rx="8" fill="#F5F7FA" stroke="#0B41CD" stroke-width="1.5" />
      <circle cx="138" cy="328" r="14" fill="#0B41CD" />
      <text x="138" y="334" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF">1</text>
      <text x="166" y="324" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Multi-Head Self-Attention</text>
      <text x="166" y="346" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">Every position attends to every position</text>
    </g>
    <g id="enc-sublayer-2">
      <rect x="110" y="372" width="495" height="56" rx="8" fill="#F5F7FA" stroke="#0B41CD" stroke-width="1.5" />
      <circle cx="138" cy="400" r="14" fill="#0B41CD" />
      <text x="138" y="406" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF">2</text>
      <text x="166" y="396" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Position-wise Feed Forward</text>
      <text x="166" y="418" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">Two linear layers, ReLU between</text>
    </g>

    <text x="110" y="466" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">WRAPPER AROUND EACH SUB-LAYER</text>
    <text x="110" y="492" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Output = LayerNorm( x + Sublayer(x) )</text>
    <text x="110" y="514" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">— residual connection then layer normalization.</text>

    <rect x="110" y="544" width="495" height="80" rx="8" fill="#F5F7FA" />
    <text x="124" y="568" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#0B41CD" letter-spacing="1.5">SHAPE CONTRACT</text>
    <text x="124" y="592" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">All sub-layers and embeddings emit dimension <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">d_model = 512</tspan></text>
    <text x="124" y="612" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">so residual addition is well-defined.</text>
  </g>

  <g id="card-decoder">
    <rect x="655" y="160" width="555" height="500" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <path d="M 669 160 h 527 a 14 14 0 0 1 14 14 v 90 h -555 v -90 a 14 14 0 0 1 14 -14 Z" fill="#1482fa" />
    <text x="932" y="212" text-anchor="middle" font-family="'Roche Sans Light',sans-serif" font-size="28" fill="#FFFFFF">Decoder</text>
    <text x="932" y="240" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="1">N = 6 IDENTICAL LAYERS · INSERTS A THIRD SUB-LAYER</text>

    <g id="dec-sublayer-1">
      <rect x="685" y="300" width="495" height="56" rx="8" fill="#FFFFFF" stroke="#1482fa" stroke-width="1.5" />
      <circle cx="713" cy="328" r="14" fill="#1482fa" />
      <text x="713" y="334" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF">1</text>
      <text x="741" y="324" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD"><tspan fill="#1482fa">Masked</tspan> Multi-Head Self-Attention</text>
      <text x="741" y="346" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">Position i attends only to positions ≤ i</text>
    </g>
    <g id="dec-sublayer-2">
      <rect x="685" y="372" width="495" height="56" rx="8" fill="#FFFFFF" stroke="#1482fa" stroke-width="2.5" />
      <circle cx="713" cy="400" r="14" fill="#1482fa" />
      <text x="713" y="406" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF">2</text>
      <text x="741" y="396" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD"><tspan fill="#1482fa">Encoder-Decoder</tspan> Attention</text>
      <text x="741" y="418" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">Q from decoder · K, V from encoder output</text>
    </g>
    <g id="dec-sublayer-3">
      <rect x="685" y="444" width="495" height="56" rx="8" fill="#F5F7FA" stroke="#1482fa" stroke-width="1.5" />
      <circle cx="713" cy="472" r="14" fill="#1482fa" />
      <text x="713" y="478" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF">3</text>
      <text x="741" y="468" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Position-wise Feed Forward</text>
      <text x="741" y="490" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">Same shape as encoder FFN</text>
    </g>

    <rect x="685" y="528" width="495" height="96" rx="8" fill="#E9EEFA" />
    <text x="699" y="552" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">THREE ASYMMETRIES VS ENCODER</text>
    <text x="699" y="578" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">· third sub-layer attends to encoder output</text>
    <text x="699" y="598" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">· self-attention is masked (no peeking at future)</text>
    <text x="699" y="618" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">· output embeddings are offset by one position</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §3.1 Encoder and Decoder Stacks</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">06</text>
  </g>
</svg>
