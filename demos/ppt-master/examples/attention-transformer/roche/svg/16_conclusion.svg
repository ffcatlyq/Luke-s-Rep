    <text x="100" y="556" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">The 2017 idea — <tspan font-family="'Roche Serif Light','Noto Serif',serif" font-style="italic" fill="#1482fa">just attention</tspan> — turned out to be the right inductive bias</text>
    <text x="100" y="586" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">for almost every modality, far beyond translation.</text>
    <text x="100" y="620" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">References: arXiv:1706.03762 · code at github.com/tensorflow/tensor2tensor</text>
