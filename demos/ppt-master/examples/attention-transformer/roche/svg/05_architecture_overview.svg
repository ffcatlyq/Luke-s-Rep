  <g id="legend">
    <rect x="620" y="148" width="600" height="472" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="620" y="148" width="5" height="472" rx="2.5" fill="#0B41CD" />
    <text x="656" y="184" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">READ THE STACK</text>
    <g id="lg-1">
      <circle cx="668" cy="230" r="16" fill="#0B41CD" />
      <text x="668" y="236" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#FFFFFF">1</text>
      <text x="700" y="226" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Embeddings + positional encoding</text>
      <text x="700" y="250" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Tokens become vectors; a sinusoidal signal injects order.</text>
    </g>
    <g id="lg-2">
      <circle cx="668" cy="308" r="16" fill="#0F5EE1" />
      <text x="668" y="314" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#FFFFFF">2</text>
      <text x="700" y="304" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">N× encoder block</text>
      <text x="700" y="328" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Multi-Head Self-Attention + position-wise Feed Forward.</text>
    </g>
    <g id="lg-3">
      <circle cx="668" cy="386" r="16" fill="#1482fa" />
      <text x="668" y="392" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#FFFFFF">3</text>
      <text x="700" y="382" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">N× decoder block</text>
      <text x="700" y="406" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Masked self-attention, encoder–decoder attention, then FFN.</text>
    </g>
    <g id="lg-4">
      <circle cx="668" cy="464" r="16" fill="#5FAAFC" />
      <text x="668" y="470" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#FFFFFF">4</text>
      <text x="700" y="460" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Add &amp; Norm on every sub-layer</text>
      <text x="700" y="484" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Residual then LayerNorm — LayerNorm(x + Sublayer(x)).</text>
    </g>
    <g id="lg-5">
      <circle cx="668" cy="542" r="16" fill="#95C7FD" />
      <text x="668" y="548" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#FFFFFF">5</text>
      <text x="700" y="538" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Final Linear + Softmax</text>
      <text x="700" y="562" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Projects decoder output to next-token probabilities.</text>
    </g>
    <rect x="656" y="586" width="548" height="1" fill="#E0E0E0" />
    <text x="656" y="606" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333"><tspan font-family="'Roche Sans Medium',sans-serif" fill="#0B41CD">d_model = 512</tspan> · every sub-layer output stays the same width, so blocks stack freely.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, Figure 1 (§3 Model Architecture) — redrawn as native vector</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">05</text>
