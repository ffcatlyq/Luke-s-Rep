<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">Complexity per layer, sequential ops, max path length</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">TABLE 1 · WHY SELF-ATTENTION · n = sequence length, d = representation dim</text>
  </g>

  <g id="table">
    <rect x="60" y="160" width="1160" height="370" fill="none" stroke="#0B41CD" stroke-width="2" />
    <g id="table-area" transform="translate(60, 160)">
      <rect x="0" y="0" width="1160" height="60" fill="#0B41CD" />
      <text x="24" y="37" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF" letter-spacing="1.5">LAYER TYPE</text>
      <text x="480" y="37" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF" letter-spacing="1.5">COMPLEXITY PER LAYER</text>
      <text x="760" y="37" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF" letter-spacing="1.5">SEQUENTIAL OPS</text>
      <text x="980" y="37" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF" letter-spacing="1.5">MAX PATH LENGTH</text>
      <line x1="300" y1="0" x2="300" y2="370" stroke="#E0E0E0" stroke-width="1.5" />
      <line x1="660" y1="0" x2="660" y2="370" stroke="#E0E0E0" stroke-width="1.5" />
      <line x1="860" y1="0" x2="860" y2="370" stroke="#E0E0E0" stroke-width="1.5" />

      <g id="row-self-attn">
        <rect x="0" y="60" width="1160" height="68" fill="#E9EEFA" />
        <text x="24" y="94" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#0B41CD">Self-Attention</text>
        <text x="24" y="116" font-family="'Roche Serif Light','Noto Serif',serif" font-size="13" font-style="italic" fill="#1482fa">the Transformer</text>
        <text x="480" y="102" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#0B41CD">O(n² · d)</text>
        <text x="760" y="102" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#007A3B">O(1)</text>
        <text x="980" y="102" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#007A3B">O(1)</text>
      </g>
      <g id="row-recurrent">
        <line x1="0" y1="128" x2="1160" y2="128" stroke="#E0E0E0" stroke-width="1" />
        <text x="24" y="162" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#333333">Recurrent</text>
        <text x="24" y="184" font-family="'Roche Serif Light','Noto Serif',serif" font-size="13" font-style="italic" fill="#706B69">RNN / LSTM / GRU</text>
        <text x="480" y="170" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#333333">O(n · d²)</text>
        <text x="760" y="170" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="22" fill="#D0021B">O(n)</text>
        <text x="980" y="170" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="22" fill="#D0021B">O(n)</text>
      </g>
      <g id="row-conv">
        <line x1="0" y1="196" x2="1160" y2="196" stroke="#E0E0E0" stroke-width="1" />
        <text x="24" y="230" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#333333">Convolutional</text>
        <text x="24" y="252" font-family="'Roche Serif Light','Noto Serif',serif" font-size="13" font-style="italic" fill="#706B69">kernel width k</text>
        <text x="480" y="238" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#333333">O(k · n · d²)</text>
        <text x="760" y="238" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="22" fill="#007A3B">O(1)</text>
        <text x="980" y="238" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#706B69">O(log_k n)</text>
      </g>
      <g id="row-restricted">
        <line x1="0" y1="264" x2="1160" y2="264" stroke="#E0E0E0" stroke-width="1" />
        <text x="24" y="298" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#333333">Self-Attention <tspan font-family="'Roche Serif Light','Noto Serif',serif" font-style="italic" fill="#706B69">(restricted)</tspan></text>
        <text x="24" y="320" font-family="'Roche Serif Light','Noto Serif',serif" font-size="13" font-style="italic" fill="#706B69">window r around each position</text>
        <text x="480" y="306" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#333333">O(r · n · d)</text>
        <text x="760" y="306" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="22" fill="#007A3B">O(1)</text>
        <text x="980" y="306" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#706B69">O(n / r)</text>
      </g>
    </g>
  </g>

  <g id="takeaway">
    <rect x="60" y="552" width="1160" height="120" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="552" width="5" height="120" rx="2.5" fill="#1482fa" />
    <text x="100" y="580" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">READ THE TABLE LIKE THIS</text>
    <text x="100" y="610" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">Self-attention pays <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#0B41CD">O(n²·d)</tspan> compute, but in return any two positions are <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#007A3B">one hop apart</tspan>.</text>
    <text x="100" y="638" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">For typical NLP where <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#333333">n &lt; d</tspan> (sequence shorter than representation), self-attention is faster than recurrent layers</text>
    <text x="100" y="658" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">— and it learns long-range dependencies more easily.</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, Table 1 (§4 Why Self-Attention)</text>
    <text x="1220" y="700" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">12</text>
  </g>
</svg>
