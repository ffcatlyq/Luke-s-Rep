<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.07" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="36" fill="#0B41CD">How they trained it</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">TRAINING SETUP · §5 · WMT'14 ENGLISH-GERMAN &amp; ENGLISH-FRENCH</text>
  </g>

  <g id="card-hardware">
    <rect x="60" y="160" width="580" height="240" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="60" y="160" width="6" height="240" rx="3" fill="#0B41CD" />
    <g transform="translate(84, 180) scale(1.33)" fill="none" stroke="#0B41CD" stroke-width="2">
      <path d="M6 5h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1v-12a1 1 0 0 1 1 -1z" />
      <path d="M9 9h6v6h-6z" /><path d="M3 10h2 M3 14h2 M10 3v2 M14 3v2 M19 10h2 M19 14h2 M10 19v2 M14 19v2" />
    </g>
    <text x="84" y="240" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">HARDWARE &amp; SCALE</text>
    <text x="84" y="296" font-family="'Roche Sans Light',sans-serif" font-size="40" fill="#0B41CD">8 × NVIDIA P100</text>
    <text x="84" y="332" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">One machine, eight GPUs — a single-node setup.</text>
    <text x="84" y="354" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">Batches of ~25,000 source + 25,000 target tokens,</text>
    <text x="84" y="376" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">grouped by similar sequence length for efficiency.</text>
  </g>

  <g id="card-time">
    <rect x="660" y="160" width="560" height="240" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="660" y="160" width="6" height="240" rx="3" fill="#1482fa" />
    <g transform="translate(684, 180) scale(1.33)" fill="none" stroke="#1482fa" stroke-width="2"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" /></g>
    <text x="684" y="240" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">TRAINING TIME</text>
    <text x="684" y="296" font-family="'Roche Sans Light',sans-serif" font-size="32" fill="#0B41CD">base</text>
    <text x="820" y="296" font-family="'Roche Sans Light',sans-serif" font-size="32" fill="#1482fa">12 h</text>
    <text x="940" y="296" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">· 100k steps</text>
    <text x="684" y="346" font-family="'Roche Sans Light',sans-serif" font-size="32" fill="#0B41CD">big</text>
    <text x="820" y="346" font-family="'Roche Sans Light',sans-serif" font-size="32" fill="#1482fa">3.5 d</text>
    <text x="940" y="346" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">· 300k steps</text>
    <text x="684" y="386" font-family="'Roche Serif Light','Noto Serif',serif" font-size="14" font-style="italic" fill="#706B69">A small fraction of the training cost of prior best models.</text>
  </g>

  <g id="card-optimizer">
    <rect x="60" y="420" width="580" height="240" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="60" y="420" width="6" height="240" rx="3" fill="#0B41CD" />
    <g transform="translate(84, 440) scale(1.33)" fill="none" stroke="#0B41CD" stroke-width="2">
      <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
      <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
    </g>
    <text x="84" y="500" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">OPTIMIZER</text>
    <text x="84" y="546" font-family="'Roche Sans Light',sans-serif" font-size="32" fill="#0B41CD">Adam</text>
    <text x="84" y="578" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#333333">β₁ = 0.9 · β₂ = 0.98 · ε = 1e-9</text>
    <text x="84" y="610" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Custom learning-rate schedule:</text>
    <text x="84" y="632" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1482fa">lr = min(step^-0.5, step · warmup^-1.5)</text>
    <text x="84" y="652" font-family="'Roche Serif Light','Noto Serif',serif" font-size="13" font-style="italic" fill="#706B69">warm up for 4,000 steps, then decay as 1/√step.</text>
  </g>

  <g id="card-regularization">
    <rect x="660" y="420" width="560" height="240" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="660" y="420" width="6" height="240" rx="3" fill="#1482fa" />
    <g transform="translate(684, 440) scale(1.33)" fill="none" stroke="#1482fa" stroke-width="2">
      <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" />
      <path d="M9 12l2 2l4 -4" />
    </g>
    <text x="684" y="500" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">REGULARIZATION</text>
    <text x="684" y="544" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">Dropout</text>
    <text x="850" y="544" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#1482fa">p = 0.1</text>
    <text x="684" y="566" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">on every sub-layer output and on the sum of embedding + PE.</text>
    <text x="684" y="610" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">Label smoothing</text>
    <text x="950" y="610" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#1482fa">ε_ls = 0.1</text>
    <text x="684" y="632" font-family="'Roche Sans',sans-serif" font-size="13" fill="#706B69">Slightly hurts perplexity, but improves BLEU and accuracy.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §5.1 Batching · §5.2 Hardware and Schedule · §5.3 Optimizer · §5.4 Regularization</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">13</text>
  </g>
</svg>
