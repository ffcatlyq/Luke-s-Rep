  <g id="property-band">
    <rect x="60" y="534" width="1160" height="126" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="534" width="5" height="126" rx="2.5" fill="url(#stripeGrad)" />
    <text x="100" y="562" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">WHY SINUSOIDS</text>
    <text x="100" y="590" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">·  With no recurrence or convolution, the model has <tspan font-family="'Roche Sans Medium',sans-serif" fill="#0B41CD">no built-in notion of order</tspan> — so order is injected, not learned.</text>
    <text x="100" y="614" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">·  Even dimensions use a sine, odd use a cosine; wavelengths form a geometric progression from <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#0B41CD">2π to 10000·2π</tspan>.</text>
    <text x="100" y="638" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">·  For any fixed offset k, <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#0B41CD">PE(pos+k)</tspan> is a linear function of <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#0B41CD">PE(pos)</tspan> — so the model learns to attend by relative position.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §3.5 (Positional Encoding) · curve redrawn as native vector · formula via LaTeX</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">11</text>
  </g>
</svg>
