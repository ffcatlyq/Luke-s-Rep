<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="dpaArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0B41CD" />
    </marker>
    <linearGradient id="bandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFF" /><stop offset="100%" stop-color="#E9EEFA" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#1482fa" />
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#0F5EE1" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.07" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">Attention as a weighted average — keys, values, queries</text>
    <text x="84" y="117" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">SCALED DOT-PRODUCT ATTENTION · §3.2.1</text>
  </g>

  <g id="formula-band">
    <rect x="60" y="150" width="1160" height="136" rx="12" fill="url(#bandBg)" stroke="#E0E0E0" stroke-width="1.5" />
    <rect x="60" y="150" width="6" height="136" rx="3" fill="url(#stripeGrad)" />
    <text x="100" y="178" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">EQUATION (1) · LaTeX-rendered</text>
    <image href="/workspaces/silicon-hitchhiker/demos/ppt-master/examples/attention-transformer/roche/assets/formula_attention.png" x="382" y="192" width="516" height="96" />
  </g>

  <g id="explanation">
    <text x="84" y="322" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">HOW IT READS</text>
    <g id="step-1">
      <circle cx="100" cy="366" r="18" fill="#0B41CD" />
      <text x="100" y="372" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">1</text>
      <text x="132" y="360" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#0B41CD">Dot-product all queries with all keys</text>
      <text x="132" y="384" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">QK<tspan baseline-shift="super" font-size="10">T</tspan> gives a similarity score between every query–key pair.</text>
    </g>
    <g id="step-2">
      <circle cx="100" cy="436" r="18" fill="#0F5EE1" />
      <text x="100" y="442" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">2</text>
      <text x="132" y="430" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#0B41CD">Scale by <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">√d_k</tspan></text>
      <text x="132" y="454" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">For large d_k the dot products grow large, pushing softmax</text>
      <text x="132" y="474" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">into low-gradient regions. Scaling counteracts that.</text>
    </g>
    <g id="step-3">
      <circle cx="100" cy="526" r="18" fill="#1482fa" />
      <text x="100" y="532" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">3</text>
      <text x="132" y="520" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#0B41CD">Softmax gives attention weights</text>
      <text x="132" y="544" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Normalize each row so the weights over keys sum to 1.</text>
    </g>
    <g id="step-4">
      <circle cx="100" cy="596" r="18" fill="#5FAAFC" />
      <text x="100" y="602" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">4</text>
      <text x="132" y="590" font-family="'Roche Sans Medium',sans-serif" font-size="18" fill="#0B41CD">Weighted sum of values</text>
      <text x="132" y="614" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Multiply weights by V to get each output position's vector.</text>
    </g>
  </g>

  <g id="flow-diagram">
    <rect x="700" y="310" width="520" height="326" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="724" y="338" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">DATAFLOW</text>
    <g id="op-q">
      <text x="748" y="388" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#0B41CD">Q</text>
      <text x="748" y="408" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#706B69">queries</text>
    </g>
    <g id="op-k">
      <text x="748" y="450" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#0B41CD">K</text>
      <text x="748" y="470" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#706B69">keys</text>
    </g>
    <g id="op-v">
      <text x="748" y="610" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#0B41CD">V</text>
      <text x="748" y="628" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#706B69">values</text>
    </g>
    <g id="step-matmul1">
      <rect x="792" y="372" width="112" height="60" rx="8" fill="#E9EEFA" stroke="#1482fa" stroke-width="1.5" />
      <text x="848" y="398" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#0B41CD">MatMul</text>
      <text x="848" y="420" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#706B69">QK<tspan baseline-shift="super" font-size="9">T</tspan></text>
    </g>
    <line x1="762" y1="384" x2="792" y2="398" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
    <line x1="762" y1="446" x2="792" y2="410" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
    <g id="step-scale">
      <rect x="932" y="372" width="96" height="60" rx="8" fill="#F0F4FC" stroke="#5FAAFC" stroke-width="1.5" />
      <text x="980" y="396" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#0F5EE1">Scale</text>
      <text x="980" y="418" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#706B69">÷ √d_k</text>
    </g>
    <line x1="904" y1="402" x2="932" y2="402" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
    <g id="step-mask">
      <rect x="1056" y="372" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#A39F9C" stroke-width="1.5" stroke-dasharray="4,3" />
      <text x="1126" y="396" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#706B69">Mask (opt.)</text>
      <text x="1126" y="418" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">decoder only</text>
    </g>
    <line x1="1028" y1="402" x2="1056" y2="402" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
    <g id="step-softmax">
      <rect x="912" y="466" width="184" height="56" rx="8" fill="#1482fa" />
      <text x="1004" y="490" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#FFFFFF">SoftMax</text>
      <text x="1004" y="512" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.92">row-wise normalize</text>
    </g>
    <line x1="1126" y1="432" x2="1050" y2="466" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
    <g id="step-matmul2">
      <rect x="912" y="562" width="184" height="56" rx="8" fill="url(#outGrad)" />
      <text x="1004" y="586" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#FFFFFF">MatMul</text>
      <text x="1004" y="608" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.92">× V → output</text>
    </g>
    <line x1="1004" y1="522" x2="1004" y2="562" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
    <line x1="762" y1="608" x2="912" y2="592" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#dpaArrow)" />
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §3.2.1 · block formula rendered via LaTeX (Computer Modern)</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">07</text>
  </g>
</svg>
