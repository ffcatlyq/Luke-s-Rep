<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.07" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="u10" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto" markerUnits="strokeWidth">
      <path d="M0,8 L4,0 L8,8 Z" fill="#95C7FD" />
    </marker>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">The supporting cast inside every layer</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">POSITION-WISE FFN · RESIDUAL CONNECTION · LAYERNORM · §3.3</text>
  </g>

  <g id="sublayer-visual">
    <rect x="60" y="160" width="340" height="500" rx="14" fill="#F8FAFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="88" y="196" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">SUB-LAYER CROSS-SECTION</text>
    <rect x="105" y="222" width="230" height="368" rx="12" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.5" />
    <text x="122" y="248" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#0B41CD">one layer block</text>
    <rect x="138" y="272" width="170" height="66" rx="8" fill="#E9EEFA" stroke="#1482fa" stroke-width="1.5" />
    <text x="223" y="311" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#0B41CD">Self-Attention</text>
    <rect x="138" y="346" width="170" height="22" rx="5" fill="#0B41CD" />
    <text x="223" y="361" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="11" fill="#FFFFFF">Add &amp; Norm</text>
    <rect x="138" y="400" width="170" height="66" rx="8" fill="#E9EEFA" stroke="#1482fa" stroke-width="1.5" />
    <text x="223" y="439" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#0B41CD">Feed Forward</text>
    <rect x="138" y="474" width="170" height="22" rx="5" fill="#0B41CD" />
    <text x="223" y="489" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="11" fill="#FFFFFF">Add &amp; Norm</text>
    <path d="M314,361 C344,361 344,278 314,278" fill="none" stroke="#95C7FD" stroke-width="1.8" marker-end="url(#u10)" />
    <path d="M314,489 C344,489 344,406 314,406" fill="none" stroke="#95C7FD" stroke-width="1.8" marker-end="url(#u10)" />
    <text x="230" y="628" text-anchor="middle" font-family="'Roche Serif Light','Noto Serif',serif" font-size="14" font-style="italic" fill="#706B69">One layer block · two sub-layers · residual arcs</text>
  </g>

  <g id="parent-frame">
    <rect x="430" y="160" width="790" height="500" rx="12" fill="#F5F7FA" fill-opacity="0.5" stroke="#1482fa" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="825" y="186" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">ONE TRANSFORMER LAYER · ENCODER OR DECODER</text>
  </g>

  <g id="card-ffn">
    <rect x="450" y="208" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="450" y="208" width="6" height="200" rx="3" fill="#0B41CD" />
    <g transform="translate(470, 226) scale(1.2)" fill="none" stroke="#0B41CD" stroke-width="2">
      <path d="M12 4l-8 4l8 4l8 -4l-8 -4z" /><path d="M4 12l8 4l8 -4" /><path d="M4 16l8 4l8 -4" />
    </g>
    <text x="506" y="250" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Position-wise FFN</text>
    <text x="470" y="284" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Two linear layers with ReLU</text>
    <text x="470" y="304" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">between, applied identically</text>
    <text x="470" y="324" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">at every position.</text>
    <rect x="470" y="346" width="206" height="48" rx="6" fill="#F5F7FA" />
    <text x="482" y="367" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#333333">FFN(x) = max(0, xW₁+b₁) W₂+b₂</text>
    <text x="482" y="387" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1482fa">inner dim = 2048 · outer = 512</text>
  </g>

  <g id="card-residual">
    <rect x="710" y="208" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="710" y="208" width="6" height="200" rx="3" fill="#1482fa" />
    <g transform="translate(730, 226) scale(1.2)" fill="none" stroke="#1482fa" stroke-width="2">
      <path d="M4 12h6a4 4 0 0 1 0 8h-6" /><path d="M4 12v8" /><path d="M14 4l6 8l-6 8" />
    </g>
    <text x="766" y="250" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Residual</text>
    <text x="730" y="284" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Skip the sub-layer, add the</text>
    <text x="730" y="304" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">input back to the output.</text>
    <text x="730" y="324" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Enables deep stacks.</text>
    <rect x="730" y="346" width="206" height="48" rx="6" fill="#E9EEFA" />
    <text x="742" y="368" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#333333">y = x + Sublayer(x)</text>
    <text x="742" y="388" font-family="'Roche Serif Light','Noto Serif',serif" font-size="12" font-style="italic" fill="#1482fa">straight gradient path top <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" font-style="normal">→</tspan> bottom</text>
  </g>

  <g id="card-layernorm">
    <rect x="970" y="208" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="970" y="208" width="6" height="200" rx="3" fill="#0F5EE1" />
    <g transform="translate(990, 226) scale(1.2)" fill="none" stroke="#0F5EE1" stroke-width="2">
      <path d="M3 12h3l2 -7l4 14l2 -7h3" /><path d="M20 5v14" />
    </g>
    <text x="1026" y="250" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">LayerNorm</text>
    <text x="990" y="284" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Normalize across feature</text>
    <text x="990" y="304" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">dimension after the residual</text>
    <text x="990" y="324" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">addition.</text>
    <rect x="990" y="346" width="206" height="48" rx="6" fill="#F5F7FA" />
    <text x="1002" y="367" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#333333">LayerNorm(x + Sublayer(x))</text>
    <text x="1002" y="387" font-family="'Roche Serif Light','Noto Serif',serif" font-size="11" font-style="italic" fill="#1482fa">stabilizes training, scale-invariant</text>
  </g>

  <g id="combined-flow">
    <rect x="450" y="436" width="760" height="200" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />
    <rect x="450" y="436" width="6" height="200" rx="3" fill="#1482fa" />
    <text x="470" y="464" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">HOW THEY COMPOSE — APPLIED TO EVERY SUB-LAYER</text>

    <rect x="478" y="494" width="160" height="48" rx="6" fill="#F5F7FA" stroke="#0B41CD" stroke-width="1.5" />
    <text x="558" y="524" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#0B41CD">Sublayer(x)</text>
    <text x="660" y="525" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#1482fa">+</text>
    <rect x="690" y="494" width="80" height="48" rx="6" fill="#E9EEFA" stroke="#1482fa" stroke-width="1.5" />
    <text x="730" y="524" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#1482fa">x</text>
    <text x="800" y="524" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#0B41CD">→</text>
    <rect x="830" y="486" width="220" height="64" rx="6" fill="#0B41CD" />
    <text x="940" y="514" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">LayerNorm</text>
    <text x="940" y="536" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.9">final sub-layer output</text>
    <text x="1080" y="524" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#0B41CD">→</text>
    <text x="1118" y="529" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#0B41CD">next</text>

    <text x="470" y="586" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">SHAPE CONTRACT</text>
    <text x="470" y="610" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">All sub-layers and embeddings emit dimension <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">d_model = 512</tspan> so the residual addition is well-defined.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §3.1 + §3.3 (Position-wise Feed-Forward Networks) — redrawn as native vector</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">10</text>
  </g>
</svg>
