<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.07" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">One mechanism, three roles in the Transformer</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">WHERE ATTENTION SHOWS UP IN THE ARCHITECTURE · §3.2.3</text>
  </g>

  <g id="pillar-enc-self">
    <rect x="60" y="160" width="380" height="500" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <path d="M 74 160 h 352 a 14 14 0 0 1 14 14 v 100 h -380 v -100 a 14 14 0 0 1 14 -14 Z" fill="#0B41CD" />
    <g transform="translate(80, 180) scale(1.33)" fill="none" stroke="#FFFFFF" stroke-width="2">
      <path d="M9 14l-4 -4l4 -4" /><path d="M5 10h11a4 4 0 1 1 0 8h-1" />
    </g>
    <text x="250" y="208" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#95C7FD" letter-spacing="2">ENCODER</text>
    <text x="250" y="240" text-anchor="middle" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#FFFFFF">Self-Attention</text>

    <text x="80" y="312" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">Q · K · V SOURCE</text>
    <rect x="80" y="324" width="340" height="48" rx="6" fill="#F5F7FA" />
    <text x="98" y="354" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#333333">Q, K, V ← previous encoder layer</text>

    <text x="80" y="406" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">Every position attends to all</text>
    <text x="80" y="442" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Every token in the source sequence can</text>
    <text x="80" y="464" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">attend to every other token — including</text>
    <text x="80" y="486" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">itself.</text>

    <text x="80" y="534" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">WHAT IT'S FOR</text>
    <text x="80" y="560" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">Build rich contextualized</text>
    <text x="80" y="582" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">representations of each source</text>
    <text x="80" y="604" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">token from its surroundings.</text>

    <rect x="80" y="624" width="340" height="20" rx="4" fill="#0B41CD" fill-opacity="0.08" />
    <text x="92" y="640" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0B41CD">attention_mask = none</text>
  </g>

  <g id="pillar-dec-masked">
    <rect x="450" y="160" width="380" height="500" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <path d="M 464 160 h 352 a 14 14 0 0 1 14 14 v 100 h -380 v -100 a 14 14 0 0 1 14 -14 Z" fill="#1482fa" />
    <g transform="translate(470, 180) scale(1.33)" fill="none" stroke="#FFFFFF" stroke-width="2">
      <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z" />
      <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" />
    </g>
    <text x="640" y="208" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="2">DECODER</text>
    <text x="640" y="240" text-anchor="middle" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#FFFFFF">Masked Self-Attention</text>

    <text x="470" y="312" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">Q · K · V SOURCE</text>
    <rect x="470" y="324" width="340" height="48" rx="6" fill="#F5F7FA" />
    <text x="488" y="354" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#333333">Q, K, V ← previous decoder layer</text>

    <text x="470" y="406" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">Only past, never future</text>
    <text x="470" y="442" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Position i attends only to positions ≤ i.</text>
    <text x="470" y="464" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Achieved by setting illegal positions to</text>
    <text x="470" y="486" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#333333">−∞ before the softmax.</text>

    <text x="470" y="534" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">WHAT IT'S FOR</text>
    <text x="470" y="560" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">Preserve auto-regression — the</text>
    <text x="470" y="582" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">model cannot peek at tokens it</text>
    <text x="470" y="604" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">hasn't produced yet.</text>

    <rect x="470" y="624" width="340" height="20" rx="4" fill="#1482fa" fill-opacity="0.1" />
    <text x="482" y="640" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1482fa">attention_mask = causal triangular</text>
  </g>

  <g id="pillar-cross">
    <rect x="840" y="160" width="380" height="500" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <path d="M 854 160 h 352 a 14 14 0 0 1 14 14 v 100 h -380 v -100 a 14 14 0 0 1 14 -14 Z" fill="#0B41CD" />
    <g transform="translate(860, 180) scale(1.33)" fill="none" stroke="#FFFFFF" stroke-width="2">
      <path d="M21 17h-18" /><path d="M6 20l-3 -3l3 -3" /><path d="M3 7h18" /><path d="M18 10l3 -3l-3 -3" />
    </g>
    <text x="1030" y="208" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#95C7FD" letter-spacing="2">ENCODER · DECODER</text>
    <text x="1030" y="240" text-anchor="middle" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#FFFFFF">Cross-Attention</text>

    <text x="860" y="312" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">Q · K · V SOURCE</text>
    <rect x="860" y="324" width="340" height="48" rx="6" fill="#F5F7FA" />
    <text x="878" y="346" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#333333">Q ← previous decoder layer</text>
    <text x="878" y="364" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#1482fa">K, V ← encoder output</text>

    <text x="860" y="406" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">Look back at the input</text>
    <text x="860" y="442" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Every decoder position can attend over</text>
    <text x="860" y="464" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">all positions of the input sequence —</text>
    <text x="860" y="486" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">the classic seq2seq attention role.</text>

    <text x="860" y="534" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">WHAT IT'S FOR</text>
    <text x="860" y="560" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">Let each output token retrieve</text>
    <text x="860" y="582" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">the relevant source information,</text>
    <text x="860" y="604" font-family="'Roche Sans',sans-serif" font-size="15" fill="#706B69">no matter where it sits.</text>

    <rect x="860" y="624" width="340" height="20" rx="4" fill="#0B41CD" fill-opacity="0.08" />
    <text x="872" y="640" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0B41CD">attention_mask = none</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §3.2.3 Applications of Attention</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">09</text>
  </g>
</svg>
