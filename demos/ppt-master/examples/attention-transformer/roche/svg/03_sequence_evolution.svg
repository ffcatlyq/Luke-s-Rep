<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.07" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="chain" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0B41CD" />
    </marker>
    <linearGradient id="bandStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#1482fa" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">From recurrent chains to a fully-connected attention mesh</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">SEQUENCE MODELING SO FAR · RNN <tspan font-family="'Consolas','DejaVu Sans Mono',monospace">→</tspan> CNN <tspan font-family="'Consolas','DejaVu Sans Mono',monospace">→</tspan> SELF-ATTENTION</text>
  </g>

  <g id="panel-rnn">
    <rect x="60" y="160" width="360" height="356" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="60" y="160" width="5" height="356" rx="2.5" fill="#0B41CD" />
    <text x="86" y="196" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">RNN / LSTM / GRU</text>
    <text x="86" y="228" font-family="'Roche Sans Light',sans-serif" font-size="24" fill="#0B41CD">Recurrent</text>
    <g id="motif-rnn">
      <line x1="115" y1="330" x2="153" y2="330" stroke="#0B41CD" stroke-width="1.6" marker-end="url(#chain)" />
      <line x1="175" y1="330" x2="213" y2="330" stroke="#0B41CD" stroke-width="1.6" marker-end="url(#chain)" />
      <line x1="235" y1="330" x2="273" y2="330" stroke="#0B41CD" stroke-width="1.6" marker-end="url(#chain)" />
      <line x1="295" y1="330" x2="333" y2="330" stroke="#0B41CD" stroke-width="1.6" marker-end="url(#chain)" />
      <circle cx="104" cy="330" r="14" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.8" />
      <circle cx="164" cy="330" r="14" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.8" />
      <circle cx="224" cy="330" r="14" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.8" />
      <circle cx="284" cy="330" r="14" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.8" />
      <circle cx="344" cy="330" r="14" fill="#0B41CD" />
      <text x="240" y="372" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#706B69">h₁ → h₂ → h₃ → h₄ → h₅</text>
    </g>
    <text x="86" y="446" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Strong, but inherently sequential —</text>
    <text x="86" y="466" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">each step waits on the one before,</text>
    <text x="86" y="486" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">so it resists parallelization.</text>
  </g>

  <g id="panel-cnn">
    <rect x="460" y="160" width="360" height="356" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="460" y="160" width="5" height="356" rx="2.5" fill="#0F5EE1" />
    <text x="486" y="196" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">BYTENET / CONVS2S</text>
    <text x="486" y="228" font-family="'Roche Sans Light',sans-serif" font-size="24" fill="#0B41CD">Convolutional</text>
    <g id="motif-cnn" fill="#0F5EE1">
      <g stroke="#95C7FD" stroke-width="1.3">
        <line x1="540" y1="300" x2="540" y2="360" /><line x1="580" y1="300" x2="580" y2="360" />
        <line x1="620" y1="300" x2="620" y2="360" /><line x1="660" y1="300" x2="660" y2="360" />
        <line x1="700" y1="300" x2="700" y2="360" /><line x1="740" y1="300" x2="740" y2="360" />
      </g>
      <circle cx="540" cy="300" r="7" /><circle cx="580" cy="300" r="7" /><circle cx="620" cy="300" r="7" /><circle cx="660" cy="300" r="7" /><circle cx="700" cy="300" r="7" /><circle cx="740" cy="300" r="7" />
      <circle cx="540" cy="330" r="7" /><circle cx="580" cy="330" r="7" /><circle cx="620" cy="330" r="7" /><circle cx="660" cy="330" r="7" /><circle cx="700" cy="330" r="7" /><circle cx="740" cy="330" r="7" />
      <circle cx="540" cy="360" r="7" /><circle cx="580" cy="360" r="7" /><circle cx="620" cy="360" r="7" /><circle cx="660" cy="360" r="7" /><circle cx="700" cy="360" r="7" /><circle cx="740" cy="360" r="7" />
      <rect x="600" y="285" width="80" height="90" rx="6" fill="none" stroke="#1482fa" stroke-width="1.6" stroke-dasharray="4,3" />
      <text x="640" y="393" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#706B69">local receptive field</text>
    </g>
    <text x="486" y="446" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Parallelizable, but signals between</text>
    <text x="486" y="466" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">distant positions still grow with</text>
    <text x="486" y="486" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">distance — linearly or log-wise.</text>
  </g>

  <g id="panel-attn">
    <rect x="860" y="160" width="360" height="356" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="860" y="160" width="5" height="356" rx="2.5" fill="#1482fa" />
    <text x="886" y="196" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">THE TRANSFORMER</text>
    <text x="886" y="228" font-family="'Roche Sans Light',sans-serif" font-size="24" fill="#0B41CD">Self-Attention</text>
    <g id="motif-mesh">
      <g stroke="#1482fa" stroke-width="1.3" stroke-opacity="0.5">
        <line x1="1040" y1="262" x2="1105" y2="309" /><line x1="1040" y1="262" x2="1080" y2="385" />
        <line x1="1040" y1="262" x2="1000" y2="385" /><line x1="1040" y1="262" x2="975" y2="309" />
        <line x1="1105" y1="309" x2="1080" y2="385" /><line x1="1105" y1="309" x2="1000" y2="385" />
        <line x1="1105" y1="309" x2="975" y2="309" /><line x1="1080" y1="385" x2="1000" y2="385" />
        <line x1="1080" y1="385" x2="975" y2="309" /><line x1="1000" y1="385" x2="975" y2="309" />
      </g>
      <circle cx="1040" cy="262" r="12" fill="#1482fa" /><circle cx="1105" cy="309" r="12" fill="#1482fa" />
      <circle cx="1080" cy="385" r="12" fill="#1482fa" /><circle cx="1000" cy="385" r="12" fill="#1482fa" />
      <circle cx="975" cy="309" r="12" fill="#1482fa" />
      <text x="1040" y="415" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#706B69">all pairs connected</text>
    </g>
    <text x="886" y="446" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Relates any two positions in a</text>
    <text x="886" y="466" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">constant number of operations —</text>
    <text x="886" y="486" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">this mesh is what the paper leans on.</text>
  </g>

  <g id="bottom-takeaway">
    <rect x="60" y="548" width="1160" height="112" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="548" width="5" height="112" rx="2.5" fill="url(#bandStripe)" />
    <text x="100" y="584" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">THE MOVE IN ONE LINE</text>
    <text x="100" y="616" font-family="'Roche Sans Light',sans-serif" font-size="21" fill="#0B41CD">From a <tspan font-family="'Roche Sans Medium',sans-serif" fill="#0B41CD">chain</tspan> to a <tspan font-family="'Roche Sans Medium',sans-serif" fill="#0F5EE1">local field</tspan> to a <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">fully-connected mesh</tspan> — attention makes distance irrelevant.</text>
    <text x="100" y="642" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">The Transformer drops recurrence and convolution and keeps only the mesh.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: Vaswani et al. 2017, §1–2 (Introduction · Background) — redrawn as native vector</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">03</text>
  </g>
</svg>
