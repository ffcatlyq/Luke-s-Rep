<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="stripe11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#1482fa" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">Read the four stages, one by one</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">WHAT EACH STAGE DOES — AND WHY · §3.1–3.2</text>
  </g>

  <g id="legend">
    <rect x="60" y="150" width="1160" height="404" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="150" width="5" height="404" rx="2.5" fill="url(#stripe11)" />

    <g id="l1">
      <circle cx="112" cy="212" r="20" fill="#0B41CD" /><text x="112" y="219" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#FFFFFF">1</text>
      <text x="152" y="206" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">Cold start</text>
      <text x="152" y="232" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Fine-tune V3-Base on thousands of curated long-CoT examples with a conversational, human-aligned style —</text>
      <text x="152" y="254" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">fixing R1-Zero's readability before any RL begins.</text>
    </g>
    <line x1="112" y1="278" x2="1180" y2="278" stroke="#E0E0E0" stroke-width="1" />
    <g id="l2">
      <circle cx="112" cy="322" r="20" fill="#0F5EE1" /><text x="112" y="329" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#FFFFFF">2</text>
      <text x="152" y="316" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">Reasoning-oriented RL</text>
      <text x="152" y="342" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Apply GRPO with rule-based rewards on math, code and logic, plus a language-consistency reward —</text>
      <text x="152" y="364" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">pushing reasoning hard while keeping each chain-of-thought in a single language.</text>
    </g>
    <line x1="112" y1="388" x2="1180" y2="388" stroke="#E0E0E0" stroke-width="1" />
    <g id="l3">
      <circle cx="112" cy="432" r="20" fill="#1482fa" /><text x="112" y="439" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#FFFFFF">3</text>
      <text x="152" y="426" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">Rejection sampling + SFT</text>
      <text x="152" y="452" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Sample from the current model, keep the best trajectories, and mix in non-reasoning data (writing, QA).</text>
      <text x="152" y="474" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Re-run SFT to broaden competence beyond verifiable tasks.</text>
    </g>
    <line x1="112" y1="498" x2="1180" y2="498" stroke="#E0E0E0" stroke-width="1" />
    <g id="l4">
      <circle cx="112" cy="530" r="20" fill="#5FAAFC" /><text x="112" y="537" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#FFFFFF">4</text>
      <text x="152" y="524" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#0B41CD">All-scenario RL</text>
      <text x="152" y="550" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">A final RL stage combining rule rewards (reasoning) with model-based preference rewards (helpfulness, safety)</text>
    </g>
  </g>

  <!-- facts strip -->
  <g id="facts">
    <rect x="60" y="574" width="1160" height="70" rx="10" fill="#0B41CD" />
    <text x="100" y="602" font-family="'Roche Sans Medium',sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.8" letter-spacing="1.5">BY THE NUMBERS</text>
    <text x="100" y="626" font-family="'Roche Sans',sans-serif" font-size="14" fill="#FFFFFF">V3-Base <tspan font-family="'Roche Sans Medium',sans-serif">671B</tspan> total / <tspan font-family="'Roche Sans Medium',sans-serif">37B</tspan> activated (MoE)</text>
    <line x1="470" y1="590" x2="470" y2="630" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <text x="500" y="626" font-family="'Roche Sans',sans-serif" font-size="14" fill="#FFFFFF">R1-Zero RL <tspan font-family="'Roche Sans Medium',sans-serif">~198 h</tspan> · R1 <tspan font-family="'Roche Sans Medium',sans-serif">~80 h</tspan> on 64×8 H800</text>
    <line x1="900" y1="590" x2="900" y2="630" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <text x="930" y="626" font-family="'Roche Sans',sans-serif" font-size="14" fill="#FFFFFF">RM data <tspan font-family="'Roche Sans Medium',sans-serif">66k</tspan> helpful + <tspan font-family="'Roche Sans Medium',sans-serif">106k</tspan> safety</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §3.1–3.2 (training details), Supplementary B (data, cost)</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">11</text>
  </g>
</svg>
