        <text x="372" y="205" fill="#333333">65.0</text><text x="515" y="205" fill="#706B69">49.9</text><text x="658" y="205" fill="#333333">59.1</text>
        <text x="801" y="205" fill="#333333">60.0</text><text x="944" y="205" fill="#333333">75.7</text>
        <text x="1088" y="205" font-weight="700" fill="#0B41CD">71.5</text>
        <line x1="0" y1="227" x2="1160" y2="227" stroke="#E0E0E0" stroke-width="1" />
        <!-- row 3 LiveCodeBench -->
        <text x="20" y="261" text-anchor="start" font-family="'Roche Sans Medium',sans-serif" fill="#333333">LiveCodeBench</text>
        <text x="372" y="262" fill="#333333">38.9</text><text x="515" y="262" fill="#706B69">32.9</text><text x="658" y="262" fill="#333333">36.2</text>
        <text x="801" y="262" fill="#333333">53.8</text><text x="944" y="262" fill="#333333">63.4</text>
        <text x="1088" y="262" font-weight="700" fill="#007A3B">65.9</text>
        <line x1="0" y1="284" x2="1160" y2="284" stroke="#E0E0E0" stroke-width="1" />
