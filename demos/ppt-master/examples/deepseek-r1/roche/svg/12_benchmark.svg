        <text x="372" y="319" fill="#333333">717</text><text x="515" y="319" fill="#706B69">759</text><text x="658" y="319" fill="#333333">1134</text>
        <text x="801" y="319" fill="#333333">1820</text><text x="944" y="319" fill="#333333">2061</text>
        <text x="1088" y="319" font-weight="700" fill="#0B41CD">2029</text>
        <line x1="0" y1="341" x2="1160" y2="341" stroke="#E0E0E0" stroke-width="1" />
        <!-- row 5 MMLU -->
        <text x="20" y="375" text-anchor="start" font-family="'Roche Sans Medium',sans-serif" fill="#333333">MMLU <tspan font-family="'Roche Serif Light','Noto Serif',serif" font-style="italic" fill="#706B69">EM</tspan></text>
        <text x="372" y="376" fill="#333333">88.3</text><text x="515" y="376" fill="#706B69">87.2</text><text x="658" y="376" fill="#333333">88.5</text>
