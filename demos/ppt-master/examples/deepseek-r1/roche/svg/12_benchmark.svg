        <!-- row 1 MATH-500 -->
        <text x="20" y="147" text-anchor="start" font-family="'Roche Sans Medium',sans-serif" fill="#333333">MATH-500</text>
        <text x="372" y="148" fill="#333333">78.3</text><text x="515" y="148" fill="#706B69">74.6</text><text x="658" y="148" fill="#333333">90.2</text>
        <text x="801" y="148" fill="#333333">90.0</text><text x="944" y="148" fill="#333333">96.4</text>
        <text x="1088" y="148" font-weight="700" fill="#007A3B">97.3</text>
