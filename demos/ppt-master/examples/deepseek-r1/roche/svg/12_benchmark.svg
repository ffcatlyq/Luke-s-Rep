      <!-- header -->
      <rect x="0" y="0" width="1160" height="56" fill="#0B41CD" />
      <rect x="1017" y="0" width="143" height="56" fill="#1482fa" />
      <text x="20" y="33" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF" letter-spacing="1.5">BENCHMARK</text>
      <g font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">
        <text x="372" y="23">Claude-3.5</text><text x="372" y="41" font-size="11" fill="#FFFFFF" fill-opacity="0.85">Sonnet</text>
        <text x="515" y="33">GPT-4o</text>
        <text x="658" y="23">DeepSeek</text><text x="658" y="41" font-size="11" fill="#FFFFFF" fill-opacity="0.85">V3</text>
        <text x="801" y="33">o1-mini</text>
        <text x="944" y="33">o1-1217</text>
        <text x="1088" y="23">DeepSeek</text><text x="1088" y="41">R1</text>
      </g>
      <!-- column separators -->
      <g stroke="#E0E0E0" stroke-width="1">
        <line x1="300" y1="0" x2="300" y2="398" /><line x1="443" y1="56" x2="443" y2="398" /><line x1="587" y1="56" x2="587" y2="398" />
        <line x1="730" y1="56" x2="730" y2="398" /><line x1="873" y1="56" x2="873" y2="398" />
      </g>
      <line x1="1017" y1="0" x2="1017" y2="398" stroke="#0B41CD" stroke-width="1.5" />

      <!-- rows -->
      <g font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="16" text-anchor="middle">
        <!-- row 0 AIME -->
        <text x="20" y="90" text-anchor="start" font-family="'Roche Sans Medium',sans-serif" fill="#333333">AIME 2024</text>
        <text x="372" y="91" fill="#333333">16.0</text><text x="515" y="91" fill="#706B69">9.3</text><text x="658" y="91" fill="#333333">39.2</text>
        <text x="801" y="91" fill="#333333">63.6</text><text x="944" y="91" fill="#333333">79.2</text>
        <text x="1088" y="91" font-weight="700" fill="#007A3B">79.8</text>
