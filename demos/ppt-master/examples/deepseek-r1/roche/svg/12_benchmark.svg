  <g id="takeaway">
    <rect x="60" y="566" width="1160" height="86" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="566" width="5" height="86" rx="2.5" fill="#007A3B" />
    <text x="100" y="594" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#007A3B" letter-spacing="1.5">READ THE TABLE LIKE THIS</text>
    <text x="100" y="622" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">R1 <tspan font-family="'Roche Sans Medium',sans-serif" fill="#007A3B">edges past o1-1217</tspan> on AIME, MATH-500 and LiveCodeBench; it trails slightly on GPQA and Codeforces —</text>
    <text x="100" y="644" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">an open-weights model trading blows with the closed frontier, and far ahead of GPT-4o and Claude-3.5 on reasoning.</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §4 main comparison table (o1-1217 from official report)</text>
    <text x="1220" y="700" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">12</text>
  </g>
</svg>
