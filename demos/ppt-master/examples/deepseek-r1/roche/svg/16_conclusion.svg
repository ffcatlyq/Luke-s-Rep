<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="stripe16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#1482fa" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">What it means — and what it still can't do</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">CONCLUSION, LIMITATIONS &amp; FUTURE WORK · §6</text>
  </g>

  <!-- takeaways -->
  <g id="takeaways">
    <rect x="60" y="150" width="560" height="400" rx="12" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.5" />
    <rect x="60" y="150" width="5" height="400" rx="2.5" fill="url(#stripe16)" />
    <text x="96" y="186" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">WHAT TO TAKE AWAY</text>

    <circle cx="112" cy="236" r="18" fill="#0B41CD" /><text x="112" y="242" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">1</text>
    <text x="146" y="230" font-family="'Roche Sans Light',sans-serif" font-size="20" fill="#0B41CD">RL alone can incentivize reasoning</text>
    <text x="146" y="256" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">The key is hard problems + a reliable verifier + enough</text>
    <text x="146" y="276" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">compute — not large-scale human annotation.</text>

    <circle cx="112" cy="336" r="18" fill="#0F5EE1" /><text x="112" y="342" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">2</text>
    <text x="146" y="330" font-family="'Roche Sans Light',sans-serif" font-size="20" fill="#0B41CD">Complex behaviors emerge</text>
    <text x="146" y="356" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Self-verification, reflection and alternative-path search</text>
    <text x="146" y="376" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">appear organically during RL — none of it hand-coded.</text>

    <circle cx="112" cy="436" r="18" fill="#1482fa" /><text x="112" y="442" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">3</text>
    <text x="146" y="430" font-family="'Roche Sans Light',sans-serif" font-size="20" fill="#0B41CD">Distillation democratizes it</text>
    <text x="146" y="456" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">The reasoning transfers to small open models, bringing</text>
    <text x="146" y="476" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">frontier-level capability to modest hardware.</text>

    <rect x="96" y="502" width="488" height="34" rx="8" fill="#E9EEFA" />
    <text x="112" y="524" font-family="'Roche Serif Light','Noto Serif',serif" font-size="15" font-style="italic" fill="#0B41CD">"Provide the right incentive — the model does the rest."</text>
  </g>

  <!-- limitations -->
  <g id="limits">
    <rect x="660" y="150" width="560" height="400" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="660" y="150" width="5" height="400" rx="2.5" fill="#D0021B" />
    <text x="696" y="186" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#D0021B" letter-spacing="1.5">KNOWN LIMITATIONS</text>

    <circle cx="704" cy="228" r="5" fill="#D0021B" />
    <text x="720" y="224" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Structured output &amp; tool use</text>
    <text x="720" y="248" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Still weak; can't yet call search engines or calculators.</text>

    <circle cx="704" cy="300" r="5" fill="#D0021B" />
    <text x="720" y="296" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Token efficiency</text>
    <text x="720" y="320" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Overthinks simple questions — room to trim reasoning length.</text>

    <circle cx="704" cy="372" r="5" fill="#D0021B" />
    <text x="720" y="368" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Language mixing</text>
    <text x="720" y="392" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Optimized for English &amp; Chinese; may mix on other languages.</text>

    <circle cx="704" cy="444" r="5" fill="#D0021B" />
    <text x="720" y="440" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Prompt sensitivity</text>
    <text x="720" y="464" font-family="'Roche Sans',sans-serif" font-size="14" fill="#333333">Few-shot prompting hurts — the authors recommend zero-shot.</text>

    <rect x="696" y="502" width="488" height="34" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" />
    <text x="712" y="524" font-family="'Roche Serif Light','Noto Serif',serif" font-size="15" font-style="italic" fill="#706B69">Frontier results, with honest, well-scoped limitations.</text>
  </g>

  <!-- closing band -->
  <g id="closing">
    <rect x="60" y="566" width="1160" height="86" rx="12" fill="#0B41CD" />
    <rect x="60" y="566" width="5" height="86" rx="2.5" fill="#1482fa" />
    <text x="100" y="596" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.8" letter-spacing="1.5">THE ONE-LINE TAKEAWAY</text>
    <text x="100" y="628" font-family="'Roche Sans Light',sans-serif" font-size="22" fill="#FFFFFF">Give a model hard problems, a reliable verifier and compute — and reasoning will follow.</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §6 (Conclusion, Limitation, and Future Work)</text>
    <text x="1220" y="700" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">16</text>
  </g>
</svg>
