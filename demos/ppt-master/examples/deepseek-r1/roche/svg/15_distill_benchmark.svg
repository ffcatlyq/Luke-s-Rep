    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">Small distilled models outrun much larger ones</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">DISTILLED MODELS VS GPT-4o &amp; CLAUDE-3.5 · §F · TABLE 15 · PASS@1</text>
  </g>

