      </g>
      <g stroke="#E0E0E0" stroke-width="1">
        <line x1="360" y1="0" x2="360" y2="402" /><line x1="520" y1="50" x2="520" y2="402" /><line x1="680" y1="50" x2="680" y2="402" /><line x1="840" y1="50" x2="840" y2="402" /><line x1="1000" y1="50" x2="1000" y2="402" />
