        <text x="440" y="344" fill="#333333">50.4</text><text x="600" y="344" fill="#333333">89.1</text><text x="760" y="344" fill="#333333">49.0</text><text x="920" y="344" fill="#333333">39.6</text><text x="1080" y="344" fill="#333333">1205</text>
        <line x1="0" y1="358" x2="1160" y2="358" stroke="#E0E0E0" stroke-width="1" />

