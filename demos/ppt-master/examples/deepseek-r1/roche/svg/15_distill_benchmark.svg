  <g id="takeaway">
    <rect x="60" y="568" width="1160" height="84" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="568" width="5" height="84" rx="2.5" fill="#007A3B" />
    <text x="100" y="596" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#007A3B" letter-spacing="1.5">READ THE TABLE LIKE THIS</text>
    <text x="100" y="624" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">Even the <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">7B</tspan> distill crushes GPT-4o on math (92.8 vs 74.6, AIME 55.5 vs 9.3); the <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">32B / 70B</tspan> reach o1-mini territory —</text>
    <text x="100" y="646" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">reasoning learned by a 671B teacher survives compression into models 20–400× smaller, with SFT alone.</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §F, Table 15 (distilled models on reasoning benchmarks) · green = best in column</text>
    <text x="1220" y="700" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">15</text>
  </g>
