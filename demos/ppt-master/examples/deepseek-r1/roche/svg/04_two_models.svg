<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" /><feOffset dx="0" dy="3" />
      <feFlood flood-color="#0B41CD" flood-opacity="0.08" /><feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="bandStripe4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#1482fa" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">Two models: the proof of concept, and the usable one</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">DEEPSEEK-R1-ZERO (§2) VS DEEPSEEK-R1 (§3)</text>
  </g>

  <!-- R1-Zero card -->
  <g id="card-zero">
    <rect x="60" y="150" width="560" height="392" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="60" y="150" width="5" height="392" rx="2.5" fill="#5FAAFC" />
    <text x="92" y="196" font-family="'Roche Sans Light',sans-serif" font-size="26" fill="#0B41CD">DeepSeek-R1-Zero</text>
    <rect x="92" y="212" width="122" height="24" rx="12" fill="#E9EEFA" />
    <text x="153" y="228" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="11" fill="#1482fa" letter-spacing="1">PURE RL</text>
    <text x="92" y="266" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">V3-Base + GRPO with rule-based rewards — no SFT stage.</text>
    <line x1="92" y1="284" x2="588" y2="284" stroke="#E0E0E0" stroke-width="1" />

    <text x="92" y="314" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#007A3B" letter-spacing="1.5">WHAT WORKS</text>
    <circle cx="99" cy="340" r="4" fill="#007A3B" />
    <text x="114" y="345" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Strong reasoning — AIME 77.9%, self-taught via RL.</text>
    <circle cx="99" cy="366" r="4" fill="#007A3B" />
    <text x="114" y="371" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Emergent reflection, verification, alternative search.</text>

    <text x="92" y="410" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#D0021B" letter-spacing="1.5">THE TRADE-OFFS</text>
    <circle cx="99" cy="436" r="4" fill="#D0021B" />
    <text x="114" y="441" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Poor readability of the chain-of-thought.</text>
    <circle cx="99" cy="462" r="4" fill="#D0021B" />
    <text x="114" y="467" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Language mixing (English / Chinese in one CoT).</text>
    <circle cx="99" cy="488" r="4" fill="#D0021B" />
    <text x="114" y="493" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Narrow — weak on writing and open-domain QA.</text>
    <text x="92" y="524" font-family="'Roche Serif Light','Noto Serif',serif" font-size="14" font-style="italic" fill="#706B69">The proof that RL alone can incentivize reasoning.</text>
  </g>

  <!-- R1 card -->
  <g id="card-r1">
    <rect x="660" y="150" width="560" height="392" rx="12" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="660" y="150" width="5" height="392" rx="2.5" fill="url(#bandStripe4)" />
    <text x="692" y="196" font-family="'Roche Sans Light',sans-serif" font-size="26" fill="#0B41CD">DeepSeek-R1</text>
    <rect x="692" y="212" width="150" height="24" rx="12" fill="#0B41CD" />
    <text x="767" y="228" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="11" fill="#FFFFFF" letter-spacing="1">MULTI-STAGE</text>
    <text x="692" y="266" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">Cold-start CoT + reasoning RL + rejection-sampling SFT + RL.</text>
    <line x1="692" y1="284" x2="1188" y2="284" stroke="#E0E0E0" stroke-width="1" />

    <text x="692" y="314" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#007A3B" letter-spacing="1.5">WHAT IT ADDS</text>
    <circle cx="699" cy="340" r="4" fill="#007A3B" />
    <text x="714" y="345" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Inherits R1-Zero's reasoning — still top-tier.</text>
    <circle cx="699" cy="366" r="4" fill="#007A3B" />
    <text x="714" y="371" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Readable CoT, language-consistent, human-aligned.</text>
    <circle cx="699" cy="392" r="4" fill="#007A3B" />
    <text x="714" y="397" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Broad — writing, open-domain QA, helpfulness + safety.</text>

    <text x="692" y="436" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">HOW</text>
    <circle cx="699" cy="462" r="4" fill="#1482fa" />
    <text x="714" y="467" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">A pipeline that layers alignment on top of reasoning.</text>
    <circle cx="699" cy="488" r="4" fill="#1482fa" />
    <text x="714" y="493" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Intermediate checkpoints: Dev1 <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">→</tspan> Dev2 <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">→</tspan> Dev3.</text>
    <text x="692" y="524" font-family="'Roche Serif Light','Noto Serif',serif" font-size="14" font-style="italic" fill="#706B69">The version that turns the proof into a product.</text>
  </g>

  <!-- bridge -->
  <g id="bridge">
    <rect x="60" y="560" width="1160" height="90" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="560" width="5" height="90" rx="2.5" fill="url(#bandStripe4)" />
    <text x="100" y="590" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">THE THROUGH-LINE</text>
    <text x="100" y="622" font-family="'Roche Sans Light',sans-serif" font-size="20" fill="#0B41CD">R1-Zero answers <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">"can RL alone teach reasoning?"</tspan> — R1 answers <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">"can it be made usable?"</tspan></text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §2 (R1-Zero) and §3 (R1)</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">04</text>
  </g>
</svg>
