<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="stripe8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B41CD" /><stop offset="100%" stop-color="#1482fa" />
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">The "aha moment" — reasoning it was never taught</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">EMERGENT SELF-REFLECTION · §2.3 · TABLE 2</text>
  </g>

  <!-- quote block -->
  <g id="quote">
    <text x="76" y="300" font-family="'Roche Serif Light','Noto Serif',serif" font-size="150" fill="#95C7FD">&#8220;</text>
    <text x="96" y="286" font-family="'Roche Serif Light','Noto Serif',serif" font-size="40" font-style="italic" fill="#0B41CD">Wait, wait. Wait.</text>
    <text x="96" y="338" font-family="'Roche Serif Light','Noto Serif',serif" font-size="40" font-style="italic" fill="#0B41CD">That's an aha moment</text>
    <text x="96" y="390" font-family="'Roche Serif Light','Noto Serif',serif" font-size="40" font-style="italic" fill="#0B41CD">I can flag here.</text>
    <rect x="98" y="418" width="70" height="4" rx="2" fill="url(#stripe8)" />
    <text x="98" y="452" font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#1482fa">An intermediate DeepSeek-R1-Zero</text>
    <text x="98" y="476" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">mid-derivation, solving for the real roots of an equation</text>
  </g>

  <!-- CoT excerpt card -->
  <g id="excerpt">
    <rect x="700" y="164" width="520" height="336" rx="12" fill="#0B41CD" />
    <text x="726" y="196" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="1.5">CoT EXCERPT · ABRIDGED</text>
    <g font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.9">
      <text x="726" y="232">&lt;think&gt;</text>
      <text x="726" y="256">  square both sides, isolate the inner</text>
      <text x="726" y="280">  square-root term, rearrange to a</text>
      <text x="726" y="304">  quartic in x ...</text>
    </g>
    <rect x="712" y="326" width="496" height="80" rx="8" fill="#1482fa" />
    <text x="736" y="356" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#FFFFFF" font-weight="700">Wait, wait. Wait. That's an aha</text>
    <text x="736" y="378" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#FFFFFF" font-weight="700">moment I can flag here.</text>
    <text x="736" y="396" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.85">let's re-evaluate step by step ...</text>
    <g font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.9">
      <text x="726" y="436">  restart from the original equation,</text>
      <text x="726" y="460">  square again, treat carefully ...</text>
      <text x="726" y="484">&lt;/think&gt;</text>
    </g>
  </g>

  <!-- takeaway -->
  <g id="takeaway">
    <rect x="60" y="524" width="1160" height="120" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="524" width="5" height="120" rx="2.5" fill="url(#stripe8)" />
    <text x="100" y="554" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">WHY IT MATTERS</text>
    <text x="100" y="586" font-family="'Roche Sans Light',sans-serif" font-size="21" fill="#0B41CD">No one rewarded the pause. RL scores only the final answer —</text>
    <text x="100" y="614" font-family="'Roche Sans Light',sans-serif" font-size="21" fill="#0B41CD">yet the model <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">discovered on its own</tspan> that stopping to re-check its work pays off.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §2.3, Table 2 (an "aha moment" of an intermediate R1-Zero) — excerpt abridged</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">08</text>
  </g>
</svg>
