    <g font-family="'Roche Sans Medium',sans-serif" font-size="14" fill="#FFFFFF">
      <circle cx="200" cy="560" r="22" fill="#5FAAFC" /><text x="200" y="565" text-anchor="middle">Zero</text>
      <circle cx="412" cy="560" r="22" fill="#1482fa" /><text x="412" y="565" text-anchor="middle">Dev1</text>
      <circle cx="625" cy="560" r="22" fill="#0F5EE1" /><text x="625" y="565" text-anchor="middle">Dev2</text>
