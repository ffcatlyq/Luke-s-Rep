    <text x="674" y="296" font-family="'Roche Sans Medium',sans-serif" font-size="17" fill="#0B41CD">Reject-sample + SFT</text>
    <text x="674" y="336" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">Filter best traces, add</text>
    <text x="674" y="356" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">non-reasoning data</text>
    <text x="674" y="376" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">(writing, QA).</text>
    <text x="674" y="410" font-family="'Roche Serif Light','Noto Serif',serif" font-size="12" font-style="italic" fill="#1482fa">broaden skills</text>
  </g>
  <g id="s4">
