    <text x="412" y="606" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#706B69">cold start + RL</text>
    <text x="625" y="606" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#706B69">+ reasoning gains</text>
    <text x="837" y="606" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#706B69">+ SFT breadth</text>
    <text x="1050" y="606" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#706B69">final alignment</text>
    <text x="100" y="632" font-family="'Roche Serif Light','Noto Serif',serif" font-size="13" font-style="italic" fill="#706B69">The next page tracks how each checkpoint scores across benchmarks.</text>
