    <text x="894" y="356" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">+ preference rewards for</text>
    <text x="894" y="376" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">helpfulness &amp; safety.</text>
    <text x="894" y="410" font-family="'Roche Serif Light','Noto Serif',serif" font-size="12" font-style="italic" fill="#1482fa">align everywhere</text>
