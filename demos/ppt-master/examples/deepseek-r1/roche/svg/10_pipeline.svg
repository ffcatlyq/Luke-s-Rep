    <text x="234" y="376" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">SFT warm-up.</text>
    <text x="234" y="410" font-family="'Roche Serif Light','Noto Serif',serif" font-size="12" font-style="italic" fill="#1482fa">readable start</text>
