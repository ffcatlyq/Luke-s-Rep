  <text x="125" y="322" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#FFFFFF">V3-Base</text>
  <text x="125" y="348" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.85">671B / 37B act.</text>

  <rect x="1090" y="200" width="130" height="230" rx="10" fill="url(#r1grad)" />
