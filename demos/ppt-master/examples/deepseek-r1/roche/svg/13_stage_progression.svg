  <g id="takeaway">
    <rect x="60" y="566" width="1160" height="86" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="566" width="5" height="86" rx="2.5" fill="#1482fa" />
    <text x="100" y="594" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#1482fa" letter-spacing="1.5">READ THE TABLE LIKE THIS</text>
    <text x="100" y="622" font-family="'Roche Sans Light',sans-serif" font-size="18" fill="#0B41CD">Reasoning is already high at R1-Zero; later stages mostly lift <tspan font-family="'Roche Sans Medium',sans-serif" fill="#1482fa">alignment</tspan> — AlpacaEval and ArenaHard</text>
    <text x="100" y="644" font-family="'Roche Sans',sans-serif" font-size="14" fill="#706B69">climb steeply into the final R1 (+25% and +17% at the last step), while math and code hold or improve. Nothing is traded away.</text>
