<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0B41CD" />
    </marker>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF" /></g>
  <image href="/workspaces/silicon-hitchhiker/assets/roche-brand/logos/Roche_Logo_800px_Blue_RGB_200px.png" x="1136" y="32" width="84" height="43.7" />

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1482fa" />
    <text x="84" y="90" font-family="'Roche Sans Light',sans-serif" font-size="34" fill="#0B41CD">The reward is a rule, not a neural network</text>
    <text x="84" y="116" font-family="'Roche Sans Medium',sans-serif" font-size="13" fill="#706B69" letter-spacing="1.5">REWARD DESIGN · §2.2 · EQ. (4) · RULE-BASED = ACCURACY + FORMAT</text>
  </g>

  <!-- schematic -->
  <g id="schematic">
    <rect x="60" y="150" width="1160" height="272" rx="12" fill="#F7F9FE" stroke="#E0E0E0" stroke-width="1" />
    <rect x="60" y="150" width="5" height="272" rx="2.5" fill="#1482fa" />
    <text x="96" y="186" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">HOW A RESPONSE IS SCORED</text>

    <rect x="96" y="248" width="176" height="80" rx="10" fill="#FFFFFF" stroke="#0B41CD" stroke-width="1.5" />
    <text x="184" y="284" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#0B41CD">Model response</text>
    <text x="184" y="306" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#706B69">to a question q</text>

    <path d="M272,270 C320,270 320,238 372,238" fill="none" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#ar)" />
    <path d="M272,306 C320,306 320,338 372,338" fill="none" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#ar)" />

    <rect x="378" y="200" width="330" height="76" rx="10" fill="#E9EEFA" stroke="#1482fa" stroke-width="1.5" />
    <text x="398" y="228" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#0B41CD">Accuracy reward</text>
    <text x="398" y="250" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">math <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">→</tspan> boxed-answer rule check</text>
    <text x="398" y="268" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">code <tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">→</tspan> compiler runs test cases</text>

    <rect x="378" y="300" width="330" height="76" rx="10" fill="#F0F4FC" stroke="#5FAAFC" stroke-width="1.5" />
    <text x="398" y="328" font-family="'Roche Sans Medium',sans-serif" font-size="15" fill="#0B41CD">Format reward</text>
    <text x="398" y="350" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333">wrap reasoning in &lt;think&gt; … &lt;/think&gt;</text>
    <text x="398" y="368" font-family="'Roche Sans',sans-serif" font-size="13" fill="#333333"><tspan font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#1482fa">→</tspan> interpretable, easy to parse</text>

    <path d="M708,238 C760,238 760,272 812,272" fill="none" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#ar)" />
    <path d="M708,338 C760,338 760,304 812,304" fill="none" stroke="#0B41CD" stroke-width="1.5" marker-end="url(#ar)" />

    <rect x="818" y="248" width="306" height="80" rx="10" fill="#0B41CD" />
    <text x="971" y="282" text-anchor="middle" font-family="'Roche Sans Medium',sans-serif" font-size="16" fill="#FFFFFF">Reward = R_acc + R_format</text>
    <text x="971" y="304" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.9">equal weight · Eq. (4)</text>
    <text x="971" y="352" text-anchor="middle" font-family="'Roche Sans',sans-serif" font-size="12" fill="#706B69">+ language-consistency reward added for DeepSeek-R1</text>
  </g>

  <!-- explanations -->
  <g id="why">
    <rect x="60" y="446" width="560" height="196" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />
    <rect x="60" y="446" width="5" height="196" rx="2.5" fill="#D0021B" />
    <text x="92" y="480" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#D0021B" letter-spacing="1.5">WHY NOT A NEURAL REWARD MODEL</text>
    <text x="92" y="514" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Neural RMs get reward-hacked at scale.</text>
    <text x="92" y="546" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">For reasoning tasks the authors avoid both outcome- and</text>
    <text x="92" y="568" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">process-based neural rewards: large-scale RL exploits them,</text>
    <text x="92" y="590" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">and retraining them adds cost and pipeline complexity.</text>
    <text x="92" y="620" font-family="'Roche Serif Light','Noto Serif',serif" font-size="14" font-style="italic" fill="#706B69">Rules give precise, verifiable feedback that can't be gamed.</text>
  </g>

  <g id="lang">
    <rect x="660" y="446" width="560" height="196" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1.5" />
    <rect x="660" y="446" width="5" height="196" rx="2.5" fill="#1482fa" />
    <text x="692" y="480" font-family="'Roche Sans Medium',sans-serif" font-size="12" fill="#1482fa" letter-spacing="1.5">ONE EXTRA REWARD FOR R1</text>
    <text x="692" y="514" font-family="'Roche Sans Light',sans-serif" font-size="19" fill="#0B41CD">Language-consistency reward.</text>
    <text x="692" y="546" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Measured as the share of target-language words in the CoT,</text>
    <text x="692" y="568" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">it curbs the English/Chinese mixing seen in R1-Zero.</text>
    <text x="692" y="590" font-family="'Roche Sans',sans-serif" font-size="15" fill="#333333">Ablation shows a slight accuracy cost —</text>
    <text x="692" y="620" font-family="'Roche Serif Light','Noto Serif',serif" font-size="14" font-style="italic" fill="#706B69">traded for readability that aligns with human preference.</text>
  </g>

  <g id="footer">
    <text x="60" y="694" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">Source: DeepSeek-AI 2026, §2.2 (Reward Design), Eq. (4), and §3.2 (language-consistency reward, Eq. 7)</text>
    <text x="1220" y="694" text-anchor="end" font-family="'Roche Sans',sans-serif" font-size="11" fill="#A39F9C">06</text>
  </g>
</svg>
